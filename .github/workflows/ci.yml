name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [document-service, traceability-service, submission-service]
    # Throwaway database for the integration tests of the services that use PostgreSQL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: verifactu
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: verifactu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifactu -d verifactu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://verifactu:test-only@localhost:5432/verifactu
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Install dependencies
        run: pip install -r ../../requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  integration:
    name: Integration Validation (Docker Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .env.example .env

      # --wait blocks until every container with a healthcheck is healthy, or fails.
      - name: Start the system
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check the services
        run: |
          for port in 8001 8002 8003; do
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 2 \
              "http://127.0.0.1:$port/health"
            echo
          done

      - name: Check the database schemas
        run: |
          set -a; 
          . ./.env; 
          set +a
          schemas=$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT count(*) FROM information_schema.schemata WHERE schema_name IN ('documents', 'traceability', 'submissions')")
          echo "Schemas found: $schemas"
          test "$schemas" = "3"

      - name: Check the migrations
        run: |
          set -a; . ./.env; set +a
          version=$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT version_num FROM documents.alembic_version")
          echo "document-service migration: $version"
          test -n "$version"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the system
        if: always()
        run: docker compose down -v