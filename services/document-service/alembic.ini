# document-service: configuración de Alembic.
# La URL de la base de datos y el esquema se leen del entorno en migrations/env.py.

[alembic]
# Relative to this file, so the command works from any directory.
script_location = %(here)s/migrations
# The `alembic` command does not have the working directory on the import path, and env.py imports `app`.
prepend_sys_path = .
path_separator = os

# Format new migrations with ruff, so autogenerated files pass the CI lint.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
